<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎡 Рулетка Судьбы</title>
<style>
:root{ --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --neon1:#ff2fd6; --neon2:#00eaff; --neon3:#ffe14d; --glass:rgba(255,255,255,.08); }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{ font-family:'Segoe UI',system-ui,sans-serif;
  background:linear-gradient(-45deg,var(--bg1),var(--bg2),var(--bg3),#1a1a2e);
  background-size:400% 400%; animation:gradientShift 14s ease infinite;
  color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:16px 12px 90px; }
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#bg-particles{position:fixed;inset:0;pointer-events:none;z-index:0}
.container{position:relative;z-index:1;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:18px}
h1{ font-size:clamp(1.6rem,6vw,2.4rem);font-weight:900;letter-spacing:1px;text-align:center;
  background:linear-gradient(90deg,var(--neon1),var(--neon2),var(--neon3),var(--neon1));
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 4s linear infinite; filter:drop-shadow(0 0 12px rgba(255,47,214,.4)); }
@keyframes shine{to{background-position:300% 0}}
.subtitle{opacity:.75;font-size:.9rem;text-align:center}
.card{ width:100%;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:18px;
  box-shadow:0 8px 32px rgba(0,0,0,.4); }
label{font-size:.85rem;opacity:.85;display:block;margin-bottom:8px}
.input-wrap{position:relative}
input[type=text]{ width:100%;padding:14px 44px 14px 16px;font-size:1.05rem;color:#fff;
  background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.2);border-radius:14px;outline:none;
  transition:border-color .3s, box-shadow .3s, transform .2s; }
input[type=text]:focus{border-color:var(--neon2);box-shadow:0 0 18px rgba(0,234,255,.45);transform:translateY(-2px)}
input[type=text].error{border-color:#ff4d6d;box-shadow:0 0 18px rgba(255,77,109,.5);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
input[type=password]{padding:14px 16px}
.clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#aaa;font-size:1.2rem;cursor:pointer;padding:6px}
.err-msg{color:#ff8fa3;font-size:.8rem;margin-top:6px;min-height:1em;transition:opacity .3s}
.wheel-zone{position:relative;display:flex;justify-content:center;margin-top:4px}
#wheelCanvas{width:min(84vw,340px);height:min(84vw,340px);filter:drop-shadow(0 0 25px rgba(0,234,255,.25))}
.pointer{ position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:5;
  font-size:2.4rem;color:var(--neon3);filter:drop-shadow(0 0 10px rgba(255,225,77,.8)); }
.pointer.bump{animation:bump .12s}
@keyframes bump{50%{transform:translateX(-50%) scale(1.25) rotate(-8deg)}}
.spin-btn{ margin-top:14px;width:100%;padding:16px;border:none;border-radius:16px;cursor:pointer;
  font-size:1.2rem;font-weight:800;letter-spacing:1px;color:#1a1a2e;
  background:linear-gradient(90deg,var(--neon3),var(--neon1),var(--neon2),var(--neon3));
  background-size:300% 100%;animation:shine 3s linear infinite;
  box-shadow:0 6px 25px rgba(255,47,214,.45);
  transition:transform .15s, box-shadow .3s, opacity .3s; }
.spin-btn:hover:not(:disabled){transform:translateY(-3px) scale(1.02);box-shadow:0 10px 35px rgba(255,47,214,.65)}
.spin-btn:active:not(:disabled){transform:scale(.96)}
.spin-btn:disabled{opacity:.45;cursor:not-allowed;animation:none;background:rgba(255,255,255,.15);color:#aaa}
.share-btn{ margin-top:10px;width:100%;padding:12px;border:1px solid rgba(0,234,255,.4);border-radius:14px;cursor:pointer;
  font-size:1rem;font-weight:700;color:#fff;background:rgba(0,234,255,.15);transition:transform .15s; }
.share-btn:active{transform:scale(.96)}
.result{ margin-top:6px;text-align:center;font-size:1.3rem;font-weight:700;min-height:1.6em;
  opacity:0;transform:scale(.7);transition:opacity .4s, transform .4s cubic-bezier(.34,1.56,.64,1); }
.result.show{opacity:1;transform:scale(1)}
.result b{color:var(--neon3);text-shadow:0 0 14px rgba(255,225,77,.7)}
#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:50}
.history{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.history span{ background:rgba(0,234,255,.15);border:1px solid rgba(0,234,255,.35);border-radius:999px;
  padding:5px 12px;font-size:.8rem;animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.tabbar{ position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;justify-content:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(15,12,41,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.1); }
.tab-btn{ background:var(--glass);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:12px;
  padding:10px 20px;font-size:.95rem;cursor:pointer;transition:all .25s; }
.tab-btn.active{background:linear-gradient(90deg,var(--neon2),var(--neon1));border:none;color:#111;font-weight:700;box-shadow:0 0 18px rgba(255,47,214,.5)}
.page{display:none;width:100%;max-width:560px;flex-direction:column;align-items:center;gap:18px}
.page.active{display:flex;animation:pageIn .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(25px) scale(.97)}to{opacity:1;transform:none}}
.modal-overlay{ position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px; }
.modal-overlay.open{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{ width:100%;max-width:360px;background:linear-gradient(145deg,var(--bg2),var(--bg1));
  border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:26px;text-align:center;
  animation:modalIn .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes modalIn{from{opacity:0;transform:scale(.75) translateY(30px)}to{opacity:1;transform:none}}
.modal h2{margin-bottom:14px}
.modal input{margin-bottom:12px}
.modal .err-msg{text-align:left}
.btn{ width:100%;padding:13px;border:none;border-radius:12px;cursor:pointer;font-size:1rem;font-weight:700;
  color:#111;background:linear-gradient(90deg,var(--neon2),var(--neon1));transition:transform .15s; }
.btn:active{transform:scale(.96)}
.btn.secondary{background:rgba(255,255,255,.15);color:#fff}
.name-list{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow-y:auto;padding:4px}
.name-row{ display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 14px;animation:popIn .3s; }
.name-row input{background:none;border:none;padding:0;font-size:1rem;flex:1;color:#fff;box-shadow:none!important;transform:none!important}
.name-row input:focus{outline:none;border-bottom:2px solid var(--neon2)}
.del-btn{background:rgba(255,77,109,.2);border:1px solid rgba(255,77,109,.5);color:#ff8fa3;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.95rem;transition:all .2s}
.del-btn:hover{background:#ff4d6d;color:#fff}
.add-row{display:flex;gap:10px}
.add-row input{flex:1}
.add-btn{background:linear-gradient(90deg,var(--neon2),var(--neon1));border:none;color:#111;font-weight:700;border-radius:12px;padding:0 20px;cursor:pointer;transition:transform .15s}
.add-btn:active{transform:scale(.95)}
.logout-btn{background:rgba(255,77,109,.2);border:1px solid rgba(255,77,109,.4);color:#ff8fa3}
.winner-modal .modal{border-color:var(--neon3);box-shadow:0 0 60px rgba(255,225,77,.4)}
.winner-name{font-size:2rem;font-weight:900;color:var(--neon3);text-shadow:0 0 20px rgba(255,225,77,.8);margin:12px 0;animation:winnerPulse 1s ease infinite}
@keyframes winnerPulse{50%{transform:scale(1.08);filter:brightness(1.3)}}
#shareBox{margin-top:10px;display:none}
#shareBox.show{display:block;animation:popIn .35s}
#shareLink{width:100%;font-size:.78rem;padding:10px 12px}
@media (max-width:400px){ .tab-btn{padding:9px 14px;font-size:.85rem} }
</style>
</head>
<body>
<canvas id="bg-particles"></canvas>
<canvas id="confettiCanvas"></canvas>

<div class="container">
  <div id="page-game" class="page active">
    <h1>🎡 Рулетка Судьбы</h1>
    <p class="subtitle">Кто окажется виноват(ым)?</p>

    <div class="card">
      <label for="actionInput">Что нужно сделать? ✍️</label>
      <div class="input-wrap">
        <input type="text" id="actionInput" maxlength="80" placeholder="Например: Кто будет мыть полы?" autocomplete="off">
        <button class="clear-btn" id="clearAction" title="Очистить">✕</button>
      </div>
      <div class="err-msg" id="actionError"></div>
    </div>

    <div class="wheel-zone">
      <div class="pointer" id="pointer">▼</div>
      <canvas id="wheelCanvas"></canvas>
    </div>

    <button class="spin-btn" id="spinBtn">🎰 КРУТИТЬ!</button>
    <div class="result" id="result"></div>
    <button class="share-btn" id="shareBtn" style="display:none">🔗 Скопировать ссылку-реплей</button>
    <div id="shareBox" class="card">
      <label>Ссылка на результат (отправь другу):</label>
      <input type="text" id="shareLink" readonly>
      <button class="btn secondary" id="copyLink" style="margin-top:10px">📋 Копировать</button>
    </div>

    <div class="card" id="historyCard" style="display:none">
      <label>📜 История выбора</label>
      <div class="history" id="history"></div>
    </div>
  </div>

  <div id="page-settings" class="page">
    <h1>⚙️ Настройки</h1>

    <div class="card" id="loginCard">
      <p class="subtitle" style="margin-bottom:14px">🔒 Доступ только для администратора</p>
      <label for="loginInput">Логин</label>
      <input type="text" id="loginInput" placeholder="Логин" autocomplete="off">
      <label for="passInput" style="margin-top:10px">Пароль</label>
      <input type="password" id="passInput" placeholder="Пароль">
      <div class="err-msg" id="loginError"></div>
      <button class="btn" id="loginBtn" style="margin-top:12px">Войти</button>
    </div>

    <div class="card" id="editorCard" style="display:none">
      <label>👥 Участники (<span id="nameCount">0</span>)</label>
      <div class="name-list" id="nameList"></div>
      <div class="add-row" style="margin-top:14px">
        <input type="text" id="newNameInput" placeholder="Новое имя" maxlength="20" autocomplete="off">
        <button class="add-btn" id="addNameBtn">＋</button>
      </div>
      <div class="err-msg" id="editorError"></div>
      <button class="btn logout-btn" id="logoutBtn" style="margin-top:14px">Выйти</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="winnerOverlay">
  <div class="modal winner-modal">
    <div style="font-size:3rem">🎉</div>
    <h2 id="winnerAction" style="font-size:1rem;opacity:.8;white-space:pre-wrap"></h2>
    <div class="winner-name" id="winnerName"></div>
    <button class="btn" id="winnerOk">Отлично!</button>
  </div>
</div>

<div class="tabbar">
  <button class="tab-btn active" data-page="game">🎰 Рулетка</button>
  <button class="tab-btn" data-page="settings">⚙️ Настройки</button>
</div>
<script>
'use strict';
/* ---------- Состояние ---------- */
const DEFAULT_NAMES = ['Андрей','Алексей','Гус','Бабон','Евген','Алеся'];
function load(key, def){ try{ const v = localStorage.getItem(key); return v===null?def:JSON.parse(v);}catch(e){return def} }
let names = load('roulette_names', null) || [...DEFAULT_NAMES];
let loggedIn = false;
function save(){ try{ localStorage.setItem('roulette_names', JSON.stringify(names)); }catch(e){} }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ---------- Фоновые частицы ---------- */
const bgC = document.getElementById('bg-particles'), bgX = bgC.getContext('2d');
let particles = [];
function resizeBg(){
  bgC.width = innerWidth; bgC.height = innerHeight;
  const n = Math.min(60, Math.floor(innerWidth*innerHeight/18000));
  particles = Array.from({length:n}, () => ({
    x:Math.random()*bgC.width, y:Math.random()*bgC.height,
    r:Math.random()*2.2+.6, s:Math.random()*.5+.15,
    hue:Math.random()<.5?190:315, tw:Math.random()*Math.PI*2
  }));
}
addEventListener('resize', resizeBg); resizeBg();
(function bgLoop(){
  bgX.clearRect(0,0,bgC.width,bgC.height);
  for(const p of particles){
    p.y -= p.s; p.tw += .04;
    if(p.y < -5){ p.y = bgC.height+5; p.x = Math.random()*bgC.width; }
    const a = .25 + .25*Math.sin(p.tw);
    bgX.beginPath(); bgX.arc(p.x,p.y,p.r,0,7);
    bgX.fillStyle = 'hsla('+p.hue+',100%,65%,'+a+')'; bgX.fill();
  }
  requestAnimationFrame(bgLoop);
})();

/* ---------- Звук ---------- */
let audioCtx;
function beep(freq, dur, type, vol){
  dur=dur||.08; type=type||'sine'; vol=vol||.15;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function fanfare(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,'triangle',.2), i*140)); }

/* ---------- Рулетка ---------- */
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const PALETTE = ['#ff2fd6','#00eaff','#ffe14d','#7cff6b','#ff6b6b','#b06bff','#ff9f43','#4dd7fa'];
const SIZE = 680;
canvas.width = canvas.height = SIZE;
const CX = SIZE/2, CY = SIZE/2, R = SIZE/2 - 8;
let angle = 0, spinning = false, lastTickIdx = -1;

function drawWheel(){
  const n = names.length;
  ctx.clearRect(0,0,SIZE,SIZE);
  ctx.beginPath(); ctx.arc(CX,CY,R+6,0,7);
  const rim = ctx.createLinearGradient(0,0,SIZE,SIZE);
  rim.addColorStop(0,'#00eaff'); rim.addColorStop(1,'#ff2fd6');
  ctx.strokeStyle = rim; ctx.lineWidth = 10; ctx.shadowColor = '#00eaff'; ctx.shadowBlur = 20;
  ctx.stroke(); ctx.shadowBlur = 0;
  if(n === 0){
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='bold 40px Segoe UI'; ctx.textAlign='center';
    ctx.fillText('Добавьте имена!',CX,CY);
    return;
  }
  const seg = (Math.PI*2)/n;
  for(let i=0;i<n;i++){
    const a0 = angle + i*seg, a1 = a0 + seg;
    ctx.beginPath(); ctx.moveTo(CX,CY); ctx.arc(CX,CY,R,a0,a1); ctx.closePath();
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = spinning ? 18 : 8;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(CX+Math.cos(a0)*R, CY+Math.sin(a0)*R);
    ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=2; ctx.stroke();
    ctx.save();
    ctx.translate(CX,CY); ctx.rotate(a0 + seg/2);
    ctx.textAlign='right'; ctx.fillStyle='#111'; ctx.font='bold 34px Segoe UI';
    ctx.fillText(names[i], R-18, 12);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(CX,CY,42,0,7);
  const cg = ctx.createRadialGradient(CX-10,CY-10,5,CX,CY,42);
  cg.addColorStop(0,'#fff'); cg.addColorStop(1,'#8899aa');
  ctx.fillStyle = cg; ctx.shadowColor='#fff'; ctx.shadowBlur=12; ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#1a1a2e'; ctx.font='bold 24px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('GO',CX,CY+1);
}

const pointer = document.getElementById('pointer');
function tickCheck(){
  const n = names.length; if(n<2) return;
  const seg = (Math.PI*2)/n;
  const a = ((-Math.PI/2 - angle) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  const idx = Math.floor(a/seg);
  if(idx !== lastTickIdx){
    lastTickIdx = idx;
    beep(1200+Math.random()*200,.04,'square',.08);
    pointer.classList.remove('bump'); void pointer.offsetWidth; pointer.classList.add('bump');
  }
}

/* ---------- Анимация вращения (easing) ----------
   spinTo(targetAngle, durationMs, onDone) — плавный разгон и торможение */
function spinTo(targetAngle, durationMs, onDone){
  spinning = true;
  const start = angle, delta = targetAngle - start, t0 = performance.now();
  function ease(t){ return 1 - Math.pow(1-t, 3.2); } // ease-out cubic-ish
  function frame(now){
    const t = Math.min((now - t0)/durationMs, 1);
    angle = start + delta * ease(t);
    tickCheck();
    if(t < 1) requestAnimationFrame(frame);
    else { angle = targetAngle; spinning = false; onDone(); }
  }
  requestAnimationFrame(frame);
}

/* ---------- Финал ---------- */
function showWinner(action, winner, idx){
  fanfare(); confetti();
  document.getElementById('result').innerHTML = '<b>'+esc(winner)+'</b> делает: «'+esc(action)+'»!';
  document.getElementById('result').classList.add('show');
  document.getElementById('winnerAction').textContent = '«'+action+'» выполняет:';
  document.getElementById('winnerName').textContent = winner;
  document.getElementById('winnerOverlay').classList.add('open');
}

/* ---------- Конфетти ---------- */
const cc = document.getElementById('confettiCanvas'), ccx = cc.getContext('2d');
function resizeCc(){ cc.width=innerWidth; cc.height=innerHeight; }
addEventListener('resize',resizeCc); resizeCc();
function confetti(){
  const confs = Array.from({length:160},()=>({
    x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*.4,
    vx:(Math.random()-.5)*14, vy:-(Math.random()*12+5),
    w:Math.random()*8+4, h:Math.random()*5+3,
    rot:Math.random()*7, vr:(Math.random()-.5)*.3,
    color:PALETTE[Math.floor(Math.random()*PALETTE.length)], life:1
  }));
  (function cLoop(){
    ccx.clearRect(0,0,cc.width,cc.height);
    confs.forEach(c=>{
      c.x+=c.vx; c.y+=c.vy; c.vy+=.32; c.vx*=.99; c.rot+=c.vr; c.life-=.011;
      ccx.save(); ccx.translate(c.x,c.y); ccx.rotate(c.rot);
      ccx.globalAlpha=Math.max(c.life,0); ccx.fillStyle=c.color;
      ccx.fillRect(-c.w/2,-c.h/2,c.w,c.h); ccx.restore();
    });
    const alive = confs.filter(c=>c.life>0 && c.y<cc.height+20);
    if(alive.length) requestAnimationFrame(cLoop);
    else ccx.clearRect(0,0,cc.width,cc.height);
  })();
}
</script>
<script>
/* ---------- Игровая логика ---------- */
const actionInput = document.getElementById('actionInput');
const actionError = document.getElementById('actionError');
const spinBtn = document.getElementById('spinBtn');
const shareBtn = document.getElementById('shareBtn');

function validateAction(showErr){
  const v = actionInput.value.trim();
  if(!v){
    if(showErr){
      actionInput.classList.add('error');
      actionError.textContent = '⚠️ Введите действие, чтобы крутить рулетку!';
      setTimeout(()=>actionInput.classList.remove('error'),450);
    }
    return null;
  }
  actionError.textContent = '';
  return v;
}
actionInput.addEventListener('input', ()=>{ if(actionInput.value.trim()) actionError.textContent=''; });
document.getElementById('clearAction').addEventListener('click', ()=>{
  actionInput.value=''; actionError.textContent=''; actionInput.focus();
});

spinBtn.addEventListener('click', ()=>{
  if(spinning) return;
  const action = validateAction(true);
  if(!action) return;
  if(names.length === 0){ actionError.textContent='⚠️ Сначала добавьте участников в настройках!'; return; }
  spinBtn.disabled = true; shareBtn.style.display='none';
  document.getElementById('result').classList.remove('show');
  beep(220,.3,'sawtooth',.1);
  // выбираем победителя и цель
  const n = names.length, seg = (Math.PI*2)/n;
  const idx = Math.floor(Math.random()*n);
  const phi = seg*(0.15 + Math.random()*0.7);
  const turns = 4 + Math.floor(Math.random()*3);
  const target = -Math.PI/2 - idx*seg - phi + turns*Math.PI*2 - angle;
  spinTo(angle + target, 4200 + turns*300, ()=>{
    const winner = names[idx];
    addHistory(winner);
    showWinner(action, winner, idx);
    spinBtn.disabled = false;
    // ссылка-реплей
    const payload = btoa(unescape(encodeURIComponent(JSON.stringify({a:action, w:idx, n:names}))));
    const link = location.origin + location.pathname + '#r=' + payload;
    document.getElementById('shareLink').value = link;
    document.getElementById('shareBox').classList.remove('show');
    shareBtn.style.display = 'block';
  });
});

/* ---------- Ссылка-реплей ---------- */
shareBtn.addEventListener('click', ()=>{
  document.getElementById('shareBox').classList.add('show');
});
document.getElementById('copyLink').addEventListener('click', function(){
  const inp = document.getElementById('shareLink');
  inp.select(); inp.setSelectionRange(0, 9999);
  const btn = this;
  const done = ()=>{ btn.textContent='✅ Скопировано!'; setTimeout(()=>btn.textContent='📋 Копировать',2000); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(inp.value).then(done).catch(()=>{ document.execCommand('copy'); done(); });
  } else { document.execCommand('copy'); done(); }
});

/* Реплей: если в URL есть #r=..., проигрываем анимацию */
function tryReplay(){
  const m = location.hash.match(/^#r=(.+)$/);
  if(!m) return;
  let data;
  try{ data = JSON.parse(decodeURIComponent(escape(atob(m[1])))); }catch(e){ return; }
  if(!data || !data.n || !data.n.length || typeof data.w !== 'number' || !data.a) return;
  names = data.n.slice(0,16);
  const action = String(data.a).slice(0,80), idx = data.w % names.length;
  // прячем ненужное, показываем режим реплея
  document.querySelector('.card').style.display='none';
  spinBtn.style.display='none';
  shareBtn.style.display='none';
  document.querySelector('.subtitle').textContent = '🎬 Реплей: «'+action+'»';
  setTimeout(()=>{
    const n = names.length, seg = (Math.PI*2)/n;
    const phi = seg*(0.3 + Math.random()*0.4);
    const turns = 4;
    const target = -Math.PI/2 - idx*seg - phi + turns*Math.PI*2 - angle;
    spinTo(angle + target, 4600, ()=>{
      showWinner(action, names[idx], idx);
      document.getElementById('historyCard').style.display='none';
      // кнопка играть самому
      const again = document.createElement('button');
      again.className='btn'; again.textContent='🎰 Крутить самому';
      again.style.marginTop='6px';
      again.addEventListener('click', ()=>{ location.hash=''; location.reload(); });
      document.getElementById('page-game').appendChild(again);
    });
  }, 700);
}

/* ---------- История ---------- */
function addHistory(name){
  const card = document.getElementById('historyCard'), h = document.getElementById('history');
  card.style.display='block';
  const s = document.createElement('span'); s.textContent = '🎯 '+name; s.title = new Date().toLocaleTimeString('ru-RU');
  h.prepend(s);
  while(h.children.length>12) h.lastChild.remove();
}

/* ---------- Навигация ---------- */
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+b.dataset.page).classList.add('active');
    beep(660,.06,'sine',.08);
  });
});

/* ---------- Логин ---------- */
function tryLogin(){
  const l = document.getElementById('loginInput').value.trim();
  const p = document.getElementById('passInput').value;
  if(l==='admin' && p==='admin'){
    loggedIn = true;
    document.getElementById('loginError').textContent='';
    document.getElementById('loginCard').style.display='none';
    document.getElementById('editorCard').style.display='block';
    renderNameList();
    beep(880,.15,'triangle',.15);
  } else {
    document.getElementById('loginError').textContent = '❌ Неверный логин или пароль!';
    beep(180,.25,'sawtooth',.15);
  }
}
document.getElementById('loginBtn').addEventListener('click', tryLogin);
['loginInput','passInput'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown',e=>{ if(e.key==='Enter') tryLogin(); });
});
document.getElementById('logoutBtn').addEventListener('click',()=>{
  loggedIn=false;
  document.getElementById('loginCard').style.display='block';
  document.getElementById('editorCard').style.display='none';
  document.getElementById('loginInput').value=''; document.getElementById('passInput').value='';
});

/* ---------- Редактор имён ---------- */
const editorError = document.getElementById('editorError');
function showEditorError(msg){
  editorError.textContent = msg;
  setTimeout(()=>{ editorError.textContent=''; }, 2500);
}
function refreshCount(){ document.getElementById('nameCount').textContent = names.length; }
function renderNameList(){
  const list = document.getElementById('nameList');
  list.innerHTML='';
  names.forEach((name,i)=>{
    const row = document.createElement('div'); row.className='name-row';
    const inp = document.createElement('input'); inp.type='text'; inp.value=name; inp.maxLength=20;
    inp.addEventListener('input',()=>{ names[i]=inp.value.trim()||name; save(); drawWheel(); });
    inp.addEventListener('blur',()=>{ if(inp.value.trim()){ names[i]=inp.value.trim(); save(); } else { inp.value=name; } });
    const del = document.createElement('button'); del.className='del-btn'; del.textContent='✕'; del.title='Удалить';
    del.addEventListener('click',()=>{
      if(names.length<=2){ showEditorError('⚠️ Минимум 2 участника!'); return; }
      names.splice(i,1); save(); renderNameList(); drawWheel(); beep(300,.1,'sine',.1);
    });
    row.append(inp,del); list.appendChild(row);
  });
  refreshCount();
}
document.getElementById('addNameBtn').addEventListener('click',()=>{
  const inp = document.getElementById('newNameInput');
  const v = inp.value.trim();
  if(!v){ showEditorError('⚠️ Введите имя!'); return; }
  if(names.includes(v)){ showEditorError('⚠️ Такое имя уже есть!'); return; }
  if(names.length>=16){ showEditorError('⚠️ Максимум 16 участников!'); return; }
  names.push(v); save(); inp.value=''; renderNameList(); drawWheel(); beep(700,.12,'triangle',.12);
});
document.getElementById('newNameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('addNameBtn').click(); });

document.getElementById('winnerOk').addEventListener('click',()=>{
  document.getElementById('winnerOverlay').classList.remove('open');
});

drawWheel();
tryReplay();
</script>
